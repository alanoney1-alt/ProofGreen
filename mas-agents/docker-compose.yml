version: '3.8'

services:
  # ========== API SERVER ==========
  api:
    build:
      context: .
      target: production
    container_name: proofgreen-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://proofgreen:${DB_PASSWORD}@postgres:5432/proofgreen
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CREDENTIALS_MASTER_KEY=${CREDENTIALS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - proofgreen-network
    volumes:
      - ./logs:/app/logs

  # ========== BACKGROUND WORKER ==========
  worker:
    build:
      context: .
      target: worker
    container_name: proofgreen-worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://proofgreen:${DB_PASSWORD}@postgres:5432/proofgreen
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proofgreen-network
    volumes:
      - ./logs:/app/logs

  # ========== POSTGRESQL ==========
  postgres:
    image: postgres:15-alpine
    container_name: proofgreen-postgres
    environment:
      - POSTGRES_USER=proofgreen
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=proofgreen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofgreen"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - proofgreen-network
    ports:
      - "5432:5432"

  # ========== REDIS ==========
  redis:
    image: redis:7-alpine
    container_name: proofgreen-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - proofgreen-network
    ports:
      - "6379:6379"

  # ========== PROMETHEUS ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: proofgreen-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - proofgreen-network

  # ========== GRAFANA ==========
  grafana:
    image: grafana/grafana:latest
    container_name: proofgreen-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - proofgreen-network

  # ========== NGINX (Optional - for production) ==========
  nginx:
    image: nginx:alpine
    container_name: proofgreen-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - proofgreen-network
    profiles:
      - production

networks:
  proofgreen-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
